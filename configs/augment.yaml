# Robustness suite. Each edit is applied to held-out test audio to measure how detection
# degrades (one report per edit). Training can sample from the same list to narrow the gap.
# MP3 is encoded in memory with soundfile; AAC, Opus and phone playback still need ffmpeg.

codecs:                       # bitrates in kbps
  mp3: [320, 192, 128, 64]
  aac: [256, 128, 64]
  opus: [128, 64, 32]

pitch_shift_semitones: [-2, -1, 1, 2]
time_stretch_rates: [0.9, 0.95, 1.05, 1.1]
# Pitch and tempo together, like "slowed" and "sped up" uploads.
speed_factors: [0.8, 0.9, 1.1, 1.25]
noise_snr_db: [30, 20, 10]    # added noise at these signal-to-noise ratios
loudness_lufs: [-23, -14]     # broadcast and streaming loudness targets

phone_playback:               # simulated phone-speaker playback and re-recording
  speaker_band_hz: [300, 8000]
  room_reverb: true
  mic_noise_snr_db: 35

training:
  probability: 0.5            # chance that a training window gets one random edit
