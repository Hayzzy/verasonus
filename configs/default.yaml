# VeraSonus default configuration.
# Load:      from verasonus.config import load_config; cfg = load_config()
# Override:  load_config(overrides={"audio.target_sample_rate": 32000})
# Relative paths are resolved from the repository root.

seed: 42

paths:
  # Datasets live under data_root: raw/, interim/, processed/ and metadata.csv.
  # The VERASONUS_DATA_ROOT environment variable overrides this (e.g. D:/verasonus-data).
  data_root: data
  checkpoints: checkpoints
  reports: reports

audio:
  # Every clip, real or AI, is decoded, down-mixed, resampled to this rate and stored the
  # same way, so models cannot learn the file format or bandwidth instead of "AI".
  # 16 kHz matches SONICS/SpecTTTra and removes everything above 8 kHz, where generators
  # differ trivially (MusicGen outputs 32 kHz audio, so it has nothing above 16 kHz).
  # Try 32000 to keep more high-frequency artefacts, then check for bandwidth shortcuts.
  target_sample_rate: 16000
  mono: true
  storage_format: FLAC      # lossless storage after resampling
  storage_subtype: PCM_16
  # Lossy codec applied to ALL clips (and every upload), so compression history cannot
  # separate the classes: the SONICS AI songs are ~37 kbps MP3s, the FMA real songs
  # 128-320 kbps. null = off.
  shared_codec: {codec: mp3, bitrate_kbps: 32}
  # Low-pass every clip here. Just below 8 kHz, resamplers leave a fingerprint: real clips
  # resampled from 44.1 kHz showed a steep cut-off that the 16 kHz generator clips lacked,
  # and one feature in that band alone separated real from AI (ROC-AUC 0.99). null = off.
  lowpass_hz: 7000
  # Scale every clip to this RMS level (dBFS), so loudness cannot separate the classes
  # (mastered real music is often louder). Clips are turned down if a peak would clip.
  target_rms_dbfs: -20
  # Clips longer than this (full songs, e.g. SONICS) are cut to one excerpt of
  # excerpt_seconds, starting 40% into the song, so every source gives similar numbers of
  # windows and full songs do not outnumber the 30-second FMA clips. Uploads are never cut.
  long_clip_seconds: 60
  excerpt_seconds: 20

windows:
  # Tracks are cut into overlapping windows. Each window gets a score; window scores are
  # combined into the track score and the segment timeline.
  length_seconds: 10.0
  hop_seconds: 5.0
  pad_last: true            # zero-pad a final partial window instead of dropping it...
  # ...if it holds at least this much real (non-padded) audio. Kept high so mostly-silent
  # padded windows cannot become a shortcut: at 2.0, nearly every clip got a final window
  # that was about half zeros. Clips shorter than this get no window at all.
  min_last_seconds: 8.0

splits:
  ratios: {train: 0.8, val: 0.1, test: 0.1}
  # Rows with the same group_id share a split: all clips of an FMA artist, and all windows
  # of a track.
  group_column: group_id
  stratify_columns: [label] # genre is only filled in for FMA so far
  generator_column: generator
  # Generators held out completely ("test_unseen") for unseen-generator tests.
  holdout_generators: []

spectrogram:
  # Log-mel input for the deep models (scripts/extract_features.py --features mel).
  # The mel scale stops at audio.lowpass_hz, so the band above it is never seen.
  n_mels: 128
  n_fft: 1024
  hop_length: 320           # 20 ms at 16 kHz
  # Each window's spectrogram covers its first this-many seconds. It must not exceed
  # windows.min_last_seconds, so no zero padding (found only on real clips) is ever included.
  seconds: 8.0

deep:
  # CNN training (scripts/train.py --model cnn). Sized for an 8 GB GPU.
  epochs: 15
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  patience: 4               # stop after this many epochs without a better val ROC-AUC
  spec_augment: true        # mask a random band of frequencies and of time in each example
  balance_classes: true     # weight the loss so real and AI windows count equally
  mmap: true                # read spectrograms from disk (the full cache is larger than RAM)

evaluation:
  # A track is called AI when its score passes a threshold chosen on the val split: the
  # lowest one that flags at most this share of real val tracks. Flagging a human artist is
  # the costliest error, so we cap it instead of using a fixed 0.5.
  max_fpr_real: 0.05
